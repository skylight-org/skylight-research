name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Check code formatting with black
      run: |
        black --check --line-length=88 sparse_attention_hub tests scripts
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --profile=black --line-length=88 --multi-line=3 -p sparse_attention_hub sparse_attention_hub tests scripts
    
    - name: Lint with flake8
      run: |
        flake8 --max-line-length=88 --extend-ignore=E203,W503,E501,E231 --exclude=build,dist,.git,__pycache__,.pytest_cache,.venv sparse_attention_hub tests scripts
    
    - name: Type check with mypy
      run: |
        mypy --ignore-missing-imports --no-strict-optional --warn-redundant-casts --warn-unused-ignores sparse_attention_hub
    
    - name: Lint with pylint
      run: |
        # Use --fail-under to only fail if score drops below threshold
        pylint --rcfile=.pylintrc --fail-under=8.0 sparse_attention_hub
    
    # TODO: Re-enable bandit security checks in CI.
    # - name: Security check with bandit
    #   run: |
    #     bandit -r sparse_attention_hub/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run unit tests
      run: |
        python scripts/run_tests.py --type unit --verbose
    
    - name: Run integration tests
      run: |
        python scripts/run_tests.py --type integration --verbose
    
    - name: Generate coverage report
      run: |
        pytest --cov=sparse_attention_hub --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  quantization-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the reference CPU runtime and development dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -e ".[dev]"
    - name: Check the installed compatibility contract and marker selection
      run: |
        python -m pytest -q tests/unit/benchmark/test_supported_runtime.py tests/unit/benchmark/test_quantization_test_categories.py
    - name: Run the documented quantization unit command
      run: |
        python -m pytest -q -m unit tests/unit/kv_quantization
    - name: Run the documented offline model integration command
      run: |
        python -m pytest -q -m integration tests/integration/test_kv_quantization*.py tests/integration/test_kivi_reference_flow.py

